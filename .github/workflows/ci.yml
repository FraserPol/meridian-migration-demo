name: CI

# This workflow is what solution-architecture.md means by "GitHub Actions
# replaces Jenkins for CI checks." It only runs verification (lint,
# typecheck, build, a migration dry-run against a throwaway Postgres
# service container, and the Migration Copilot eval) — it does NOT deploy
# anything. Deployment is owned by Vercel's native Git integration
# (Preview Deployments on every push, Rolling Releases on promotion to
# production), which is deliberately kept out of this workflow so the two
# responsibilities stay separated.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://meridian:meridian@localhost:5432/meridian
      AUTH_SECRET: ci-only-secret-not-used-in-any-real-environment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migration dry-run
        run: npm run db:migrate

      - name: Build
        run: npm run build

      - name: Migration Copilot eval (tool-call order)
        # Calls the real model via AI Gateway on 5 fixed prompts, asserting
        # inventory -> strategy -> config ordering — see
        # lib/ai/migration-copilot.eval.test.ts. Skips gracefully (not a
        # failure) if AI_GATEWAY_API_KEY isn't set as a repo secret, so
        # this never breaks CI for a fork without billing configured.
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: npm run test:eval
